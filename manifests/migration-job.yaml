# Run-once migration, deliberately NOT baked into the backend Deployment's
# entrypoint - at 2+ replicas, every Pod starting up would independently
# race on `alembic upgrade head` against the same database.
#
# Now wired as an Argo CD PreSync hook (see annotations below) - Argo runs
# this automatically before every sync, and BeforeHookCreation deletes the
# previous run first, so there's no more manual delete-then-reapply dance.
#
# For manual/pre-GitOps use, the old workflow still works fine:
#   kubectl apply -f manifests/migration-job.yaml
#   kubectl wait --for=condition=complete job/taskapp-migrate -n taskapp --timeout=120s
#   kubectl delete job taskapp-migrate -n taskapp
apiVersion: batch/v1
kind: Job
metadata:
  name: taskapp-migrate
  namespace: taskapp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: taskapp-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc # keep in sync with backend/deployment.yaml
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: taskapp-config
            - secretRef:
                name: taskapp-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
